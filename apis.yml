aid: aerofarms
name: AeroFarms
description: 'AeroFarms is an indoor vertical farming company founded in 2004 and headquartered in Newark, New Jersey,
  where it grows leafy greens and nutrient-dense microgreens — micro broccoli, micro arugula, micro wasabi mustard
  and the FlavorSpectrum blends — aeroponically, without sun or soil, under LED light recipes driven by its proprietary
  agSTACK PLC/SCADA control stack. It sells through US grocery retail rather than through software, is a Certified
  B Corporation, and was acquired by an affiliate of Palm Ventures in June 2026. AeroFarms is a produce grower,
  not a software vendor: no developer portal, no API documentation, no SDKs, no API product. The machine-readable
  surface profiled here is the anonymous, read-only WordPress and WooCommerce REST API behind www.aerofarms.com,
  a live OAuth-protected MCP server at /wp-json/mcp/mcp-oauth-server, and a published llms.txt.'
