- aid: aerofarms:aerofarms-mcp-server
  name: AeroFarms MCP Server
  description: 'A live Model Context Protocol server served from www.aerofarms.com at /wp-json/mcp/mcp-oauth-server.
    It answers JSON-RPC over HTTP and is protected by OAuth 2.1: an anonymous tools/list returns HTTP 401 with a
    WWW-Authenticate Bearer challenge naming RFC 9728 protected-resource metadata, and the site publishes RFC 8414
    authorization-server metadata declaring PKCE S256, authorization_code and refresh_token grants and a single
    ''mcp'' scope. Verified by probe on 2026-09-10. The tool list itself requires an authenticated session and is
    therefore not enumerated here.'
  humanURL: https://www.aerofarms.com/wp-json/mcp
  baseURL: https://www.aerofarms.com/wp-json/mcp/mcp-oauth-server
