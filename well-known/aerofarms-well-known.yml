note: >-
  Two real RFC 8615 discovery documents are served, and both belong to the Model Context Protocol
  server this site runs at /wp-json/mcp/mcp-oauth-server. Both paths answer 301 without a trailing
  slash and 200 with one, so the saved status is the status of the followed request; the bodies are
  saved verbatim. Everything else 404s. Note the shape of the misses: www.aerofarms.com returns its
  full HTML 404 page (264KB) with a real 404 status for unknown /.well-known/* paths, so these are
  honest absences rather than a soft-200 shell. /.well-known/security.txt is the one exception — it
  is answered by the edge with a short plain 404, not by WordPress. No SecurityTxt pointer is
  emitted, because AeroFarms serves no security.txt. Only the WellKnown pointer is emitted, on the
  strength of the two OAuth documents that really are served.
