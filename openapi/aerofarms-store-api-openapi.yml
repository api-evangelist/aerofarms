components:
  schemas:
    StoreProductCategory:
      type: object
      properties:
        id:
          description: Unique identifier for the resource.
          type: integer
        name:
          description: Term name.
          type: string
        slug:
          description: String based identifier for the term.
          type: string
        description:
          description: Term description.
          type: string
        parent:
          description: Parent term ID, if applicable.
          type: integer
        count:
          description: Number of objects (posts of any type) assigned to the term.
          type: integer
        image:
          description: Category image.
          type: object
          properties:
            id:
              description: Image ID.
              type: integer
            src:
              description: Full size image URL.
              type: string
              format: uri
            thumbnail:
              description: Thumbnail URL.
              type: string
              format: uri
            srcset:
              description: Full size image srcset for responsive images.
              type: string
            sizes:
              description: Full size image sizes for responsive images.
              type: string
            thumbnail_srcset:
              description: Thumbnail srcset for responsive images.
              type: string
            thumbnail_sizes:
              description: Thumbnail sizes for responsive images.
              type: string
            name:
              description: Image name.
              type: string
            alt:
              description: Image alternative text.
              type: string
        review_count:
          description: Number of reviews for products in this category.
          type: integer
        permalink:
          description: Category URL.
          type: string
          format: uri
      title: product-category
    StoreCollectionData:
      type: object
      properties:
        price_range:
          description: Min and max prices found in collection of products, provided using the smallest unit of the currency.
          type:
          - object
          - 'null'
          properties:
            currency_code:
              description: Currency code (in ISO format) for returned prices.
              type: string
            currency_symbol:
              description: Currency symbol for the currency which can be used to format returned prices.
              type: string
            currency_minor_unit:
              description: Currency minor unit (number of digits after the decimal separator) for returned prices.
              type: integer
            currency_decimal_separator:
              description: Decimal separator for the currency which can be used to format returned prices.
              type: string
            currency_thousand_separator:
              description: Thousand separator for the currency which can be used to format returned prices.
              type: string
            currency_prefix:
              description: Price prefix for the currency which can be used to format returned prices.
              type: string
            currency_suffix:
              description: Price prefix for the currency which can be used to format returned prices.
              type: string
            min_price:
              description: Min price found in collection of products.
              type: string
            max_price:
              description: Max price found in collection of products.
              type: string
        attribute_counts:
          description: Returns number of products within attribute terms.
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              term:
                description: Term ID
                type: integer
              count:
                description: Number of products.
                type: integer
        rating_counts:
          description: Returns number of products with each average rating.
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              rating:
                description: Average rating
                type: integer
              count:
                description: Number of products.
                type: integer
        stock_status_counts:
          description: Returns number of products with each stock status.
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              status:
                description: Status
                type: string
              count:
                description: Number of products.
                type: integer
        taxonomy_counts:
