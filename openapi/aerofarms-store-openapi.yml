                      type: string
                      format: uri
                    thumbnail:
                      description: Thumbnail URL.
                      type: string
                      format: uri
                    srcset:
                      description: Full size image srcset for responsive images.
                      type: string
                    sizes:
                      description: Full size image sizes for responsive images.
                      type: string
                    thumbnail_srcset:
                      description: Thumbnail srcset for responsive images.
                      type: string
                    thumbnail_sizes:
                      description: Thumbnail sizes for responsive images.
                      type: string
                    name:
                      description: Image name.
                      type: string
                    alt:
                      description: Image alternative text.
                      type: string
              categories:
                description: List of categories, if applicable.
                type: array
                items:
                  type: object
                  properties:
                    id:
                      description: Category ID
                      type: number
                    name:
                      description: Category name
                      type: string
                    slug:
                      description: Category slug
                      type: string
                    link:
                      description: Category link
                      type: string
              tags:
                description: List of tags, if applicable.
                type: array
                items:
                  type: object
                  properties:
                    id:
                      description: Tag ID
                      type: number
                    name:
                      description: Tag name
                      type: string
                    slug:
                      description: Tag slug
                      type: string
                    link:
                      description: Tag link.
                      type: string
              brands:
                description: List of brands, if applicable.
                type: array
                items:
                  type: object
                  properties:
                    id:
                      description: Brand ID
                      type: number
                    name:
                      description: Brand name
                      type: string
                    slug:
                      description: Brand slug
                      type: string
                    link:
                      description: Brand link
                      type: string
              attributes:
                description: List of attributes (taxonomy terms) assigned to the product. For variable products, these are
                  mapped to variations (see the `variations` field).
                type: array
                items:
                  type: object
                  properties:
                    id:
                      description: The attribute ID, or 0 if the attribute is not taxonomy based.
                      type: integer
                    name:
                      description: The attribute name.
                      type: string
                    taxonomy:
                      description: The attribute taxonomy, or null if the attribute is not taxonomy based.
                      type: string
                    has_variations:
                      description: True if this attribute is used by product variations.
                      type: boolean
                    terms:
                      description: List of assigned attribute terms.
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            description: The term ID, or 0 if the attribute is not a global attribute.
                            type: integer
                          name:
                            description: The term name.
                            type: string
                          slug:
                            description: The term slug.
                            type: string
                          default:
                            description: If this is a default attribute
                            type: boolean
              variations:
                description: List of variation IDs, if applicable.
                type: array
                items:
                  type: object
                  properties:
                    id:
                      description: The attribute ID, or 0 if the attribute is not taxonomy based.
                      type: integer
                    attributes:
                      description: List of variation attributes.
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            description: The attribute name.
                            type: string
                          value:
                            description: The assigned attribute.
                            type: string
              grouped_products:
                description: List of grouped product IDs, if applicable.
                type: array
                items:
                  description: List of grouped product ids.
                  type: integer
              has_options:
                description: Does the product have additional options before it can be added to the cart?
                type: boolean
              is_purchasable:
                description: Is the product purchasable?
                type: boolean
              is_in_stock:
                description: Is the product in stock?
                type: boolean
              is_on_backorder:
                description: Is the product stock backordered? This will also return false if backorder notifications are
                  turned off.
                type: boolean
              stock_availability:
                description: Information about the product's availability.
                type: object
                properties:
                  text:
                    description: Stock availability text.
                    type: string
                  class:
                    description: Stock availability class.
                    type: string
              low_stock_remaining:
                description: Quantity left in stock if stock is low, or null if not applicable.
                type:
                - number
                - 'null'
              sold_individually:
                description: If true, only one item of this product is allowed for purchase in a single order.
                type: boolean
              weight:
                description: Product weight (kg).
                type: string
              dimensions:
                description: Product dimensions.
                type: object
                properties:
                  length:
                    description: Product length (cm).
                    type: string
                  width:
                    description: Product width (cm).
                    type: string
                  height:
                    description: Product height (cm).
                    type: string
              formatted_weight:
                description: Product weight formatted for display (e.g. "2.5 kg").
                type: string
              formatted_dimensions:
                description: Product dimensions formatted for display (e.g. "10 × 5 × 3 cm").
                type: string
              add_to_cart:
                description: Add to cart button parameters.
                type: object
                properties:
                  text:
                    description: Button text.
                    type: string
                  description:
                    description: Button description.
                    type: string
                  url:
                    description: Add to cart URL.
                    type: string
                  minimum:
                    description: The minimum quantity that can be added to the cart.
                    type: number
                  maximum:
                    description: The maximum quantity that can be added to the cart.
                    type: number
                  multiple_of:
                    description: The amount that quantities increment by. Quantity must be an multiple of this value.
                    type: number
                    default: 1
                  single_text:
                    description: Button text in the single product page.
                    type: string
              is_password_protected:
                description: Whether the product requires a password to access its content.
                type: boolean
              extensions:
                type: object
                properties: []
        needs_payment:
          description: True if the cart needs payment. False for carts with only free products and no shipping costs.
          type: boolean
        needs_shipping:
          description: True if the cart needs shipping. False for carts with only digital goods or stores with no shipping
            methods set-up.
          type: boolean
        has_calculated_shipping:
          description: True if the cart meets the criteria for showing shipping costs, and rates have been calculated and
            included in the totals.
          type: boolean
        fees:
          description: List of cart fees.
          type: array
          items:
            type: object
            properties:
              id:
                description: Unique identifier for the fee within the cart.
                type: string
              name:
                description: Fee name.
                type: string
              totals:
                description: Fee total amounts provided using the smallest unit of the currency.
                type: object
                properties:
                  currency_code:
                    description: Currency code (in ISO format) for returned prices.
                    type: string
                  currency_symbol:
                    description: Currency symbol for the currency which can be used to format returned prices.
                    type: string
                  currency_minor_unit:
                    description: Currency minor unit (number of digits after the decimal separator) for returned prices.
                    type: integer
                  currency_decimal_separator:
                    description: Decimal separator for the currency which can be used to format returned prices.
                    type: string
                  currency_thousand_separator:
                    description: Thousand separator for the currency which can be used to format returned prices.
                    type: string
                  currency_prefix:
                    description: Price prefix for the currency which can be used to format returned prices.
                    type: string
                  currency_suffix:
                    description: Price prefix for the currency which can be used to format returned prices.
                    type: string
                  total:
                    description: Total amount for this fee.
                    type: string
                  total_tax:
                    description: Total tax amount for this fee.
                    type: string
        totals:
          description: Cart total amounts provided using the smallest unit of the currency.
          type: object
          properties:
            currency_code:
              description: Currency code (in ISO format) for returned prices.
              type: string
            currency_symbol:
              description: Currency symbol for the currency which can be used to format returned prices.
              type: string
            currency_minor_unit:
              description: Currency minor unit (number of digits after the decimal separator) for returned prices.
              type: integer
            currency_decimal_separator:
              description: Decimal separator for the currency which can be used to format returned prices.
              type: string
            currency_thousand_separator:
              description: Thousand separator for the currency which can be used to format returned prices.
              type: string
            currency_prefix:
              description: Price prefix for the currency which can be used to format returned prices.
              type: string
            currency_suffix:
              description: Price prefix for the currency which can be used to format returned prices.
              type: string
            total_items:
              description: Total price of items in the cart.
              type: string
            total_items_tax:
              description: Total tax on items in the cart.
              type: string
            total_fees:
              description: Total price of any applied fees.
              type: string
            total_fees_tax:
              description: Total tax on fees.
              type: string
            total_discount:
              description: Total discount from applied coupons.
              type: string
            total_discount_tax:
              description: Total tax removed due to discount from applied coupons.
              type: string
            total_shipping:
              description: Total price of shipping. If shipping has not been calculated, a null response will be sent.
              type:
              - string
              - 'null'
            total_shipping_tax:
              description: Total tax on shipping. If shipping has not been calculated, a null response will be sent.
              type:
              - string
              - 'null'
            total_price:
              description: Total price the customer will pay.
              type: string
            total_tax:
              description: Total tax applied to items and shipping.
              type: string
            tax_lines:
              description: Lines of taxes applied to items and shipping.
              type: array
              items:
                type: object
                properties:
                  name:
                    description: The name of the tax.
                    type: string
                  price:
                    description: The amount of tax charged.
                    type: string
                  rate:
                    description: The rate at which tax is applied.
                    type: string
        errors:
          description: List of cart item errors, for example, items in the cart which are out of stock.
          type: array
          items:
            type: object
            properties:
              code:
                description: Error code
                type: string
              message:
                description: Error message
                type: string
        payment_methods:
          description: List of available payment method IDs that can be used to process the order.
          type: array
        payment_requirements:
          description: List of required payment gateway features to process the order.
          type: array
        extensions:
          type: object
          properties: []
      title: cart
