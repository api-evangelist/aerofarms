  /wc/store/v1/cart:
    get:
      operationId: getCart
      summary: Retrieve the cart
      description: Retrieve the anonymous session cart. Answers 200 without credentials and returns an empty cart for a new
        session; a Cart-Token header carries session state.
      tags:
      - Cart
      responses:
        '200':
          description: Retrieve the cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Invalid parameter(s) — rest_invalid_param.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
